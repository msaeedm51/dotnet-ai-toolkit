# Agent routing catalog. An AI assistant scans `triggers` against the current request to
# pick the matching agent(s), then loads that agent's file (agents/<id>.md) for its full
# workflow, constraints, and escalation conditions. `loads_skills` lists the skill ids
# (see skills/INDEX.yaml) that agent typically needs -- still filter by the specific
# request rather than loading all of them for every task.
#
# Schema (informal):
#   id, path, title, triggers[], loads_skills[], loads_rules[], related_agents[]

- id: architect
  path: agents/architect.md
  title: Architect Agent
  triggers:
    - design the architecture
    - new service
    - should we use microservices
    - architecture decision
    - adr
    - modular monolith
    - restructure the project
    - evaluate tradeoffs
  loads_skills:
    - clean-architecture
    - ddd
    - cqrs
    - modular-monolith
    - microservices
    - event-driven-architecture
    - repository-specification
    - result-pattern
    - domain-events-and-outbox
    - dependency-injection-design
  loads_rules: [rules/architecture.md, rules/general.md]
  related_agents: [dotnet-developer, api-engineer, database-engineer, security-reviewer, performance-engineer]

