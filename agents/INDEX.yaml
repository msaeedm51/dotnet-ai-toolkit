    - model-validation-problemdetails
    - background-services
    - efcore-fundamentals
  loads_rules: [rules/general.md, rules/csharp.md, rules/dotnet.md, rules/architecture.md, rules/testing.md]
  related_agents: [architect, api-engineer, database-engineer, test-engineer, code-reviewer]

