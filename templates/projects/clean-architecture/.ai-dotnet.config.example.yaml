# Copy to .ai-dotnet/config.yaml after vendoring the toolkit into your new project.
# Schema: ../../../config/config.schema.json
project:
  name: "clean-architecture-template"
  description: "Product catalog service demonstrating Domain/Application/Infrastructure/Api layering."
  type: api
  architecture:
    - clean-architecture

backend:
  framework: aspnetcore-minimal-api
  dotnet_version: "8"
  database:
    engine: postgresql   # template ships with SQLite for zero-dependency builds/tests --
                          # switch to your real engine (skills/data/sql-server.md or
                          # skills/data/postgresql.md) before shipping this beyond a demo
    orm: efcore
    role: primary
  authentication:
    scheme: none

deployment:
  platform: linux-docker
  containerized: false

rules:
  strict_architecture: true
  require_tests: true
  require_security_review: true
  enforce_nullable_reference_types: true
